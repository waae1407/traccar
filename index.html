<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/user_68d033161412d5b125c58fda/e0b7fe7d9_94087D67-9034-4A3E-BA7B-C9592E9A9CC8.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uRide Car Rental</title>
    <meta name="description" content="uRide Car Rental Management System - Fleet, Bookings, Payments & Rent-to-Own" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "3edc6b4e-bc99-4f51-af70-b7ca29004e64",
          promptOptions: {
            slidedown: {
              prompts: [
                {
                  type: "push",
                  text: {
                    actionMessage: "Get notified about your bookings, payments, and vehicle alerts.",
                    acceptButton: "Allow",
                    cancelButton: "Not Now"
                  }
                }
              ]
            }
          }
        });
        // Manually trigger the slidedown prompt after init (more reliable than autoPrompt)
        OneSignal.showSlidedownPrompt();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
