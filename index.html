<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/user_68d033161412d5b125c58fda/e0b7fe7d9_94087D67-9034-4A3E-BA7B-C9592E9A9CC8.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>uRide Car Rental</title>
    <meta name="description" content="uRide Car Rental Management System - Fleet, Bookings, Payments & Rent-to-Own" />
    <script>
      // Layer 2: Redirect all *.base44.app traffic to the canonical production domain.
      // Prevents the internal Base44 subdomain from appearing in browser permission
      // prompts (location, camera, notifications), address bars, or shared links.
      (function() {
        var host = window.location.hostname.toLowerCase();
        if (!host.includes("base44") || host === "localhost" || host === "127.0.0.1") return;
        // Delay redirect to let the builder/preview bridge (window.__base44_preview)
        // signal that we're inside the builder — if so, skip the redirect entirely.
        var checks = 0;
        var timer = setInterval(function() {
          if (window.__base44_preview || ++checks > 8) {
            clearInterval(timer);
            if (window.__base44_preview) return;
            try { if (window.self !== window.top) return; } catch (e) { return; }
            window.location.replace("https://uridehub.com" + window.location.pathname + window.location.search + window.location.hash);
          }
        }, 50);
      })();
    </script>
    <script>
      // On custom host storefront domains, set a light background immediately
      // to prevent a dark/black flash before the SPA renders, AND clear any
      // stale auth token from localStorage. The storefront is a public page —
      // a stale/expired token from a previous login causes 401s on every API
      // call, which blocks rendering (white screen). The SDK's getAccessToken()
      // falls back to localStorage, so we must clear it before any JS loads.
      (function() {
        var host = window.location.hostname.toLowerCase();
        var isCustom = !["localhost","127.0.0.1","uridehub.com","www.uridehub.com"].includes(host) && !host.includes("base44");
        if (isCustom) {
          document.documentElement.style.background = "#f8f8fa";
          try {
            localStorage.removeItem("base44_access_token");
            sessionStorage.removeItem("base44_access_token");
          } catch(e) {}
        }
      })();
    </script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // OneSignal is configured for uridehub.com only — skip init on custom
        // host storefront domains to avoid "Can only be used on" errors.
        var host = window.location.hostname.toLowerCase();
        var isCanonical = host === "uridehub.com" || host === "www.uridehub.com" ||
                          host === "localhost" || host === "127.0.0.1";
        if (!isCanonical) return;
        await OneSignal.init({
          appId: "3edc6b4e-bc99-4f51-af70-b7ca29004e64",
          promptOptions: {
            slidedown: {
              prompts: [
                {
                  type: "push",
                  text: {
                    actionMessage: "Get notified about your bookings, payments, and vehicle alerts.",
                    acceptButton: "Allow",
                    cancelButton: "Not Now"
                  }
                }
              ]
            }
          }
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
