<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/user_68d033161412d5b125c58fda/e0b7fe7d9_94087D67-9034-4A3E-BA7B-C9592E9A9CC8.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uRide Car Rental</title>
    <meta name="description" content="uRide Car Rental Management System - Fleet, Bookings, Payments & Rent-to-Own" />
    <script>
      // On custom host storefront domains, set a light background immediately
      // to prevent a dark/black flash before the SPA renders.
      (function() {
        var host = window.location.hostname.toLowerCase();
        var isCustom = !["localhost","127.0.0.1","uridehub.com","www.uridehub.com"].includes(host) && !host.includes("base44");
        if (isCustom) document.documentElement.style.background = "#f8f8fa";
      })();
    </script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // OneSignal is configured for uridehub.com only — skip init on custom
        // host storefront domains to avoid "Can only be used on" errors.
        var host = window.location.hostname.toLowerCase();
        var isCanonical = host === "uridehub.com" || host === "www.uridehub.com" ||
                          host === "localhost" || host === "127.0.0.1";
        if (!isCanonical) return;
        await OneSignal.init({
          appId: "3edc6b4e-bc99-4f51-af70-b7ca29004e64",
          promptOptions: {
            slidedown: {
              prompts: [
                {
                  type: "push",
                  text: {
                    actionMessage: "Get notified about your bookings, payments, and vehicle alerts.",
                    acceptButton: "Allow",
                    cancelButton: "Not Now"
                  }
                }
              ]
            }
          }
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
